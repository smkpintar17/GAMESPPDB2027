<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SMK PINTAR 3D Runner - SMK 17 Muncar</title>
  <style>
    body { margin: 0; overflow: hidden; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #111; color: #fff; }
    #canvas-container { width: 100vw; height: 100vh; display: block; }
    .ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; padding: 15px; box-sizing: border-box; }
    .interactive { pointer-events: auto; }
    .hud { background: rgba(0, 0, 0, 0.6); padding: 10px 20px; border-radius: 10px; backdrop-filter: blur(5px); border: 1px solid rgba(255,255,255,0.2); }
    .hud-title { font-weight: bold; font-size: 18px; color: #f1c40f; }
    .hud-stats { font-size: 16px; margin-top: 5px; }
    .btn { background: #e74c3c; color: white; border: none; padding: 10px 20px; font-weight: bold; border-radius: 5px; cursor: pointer; transition: 0.2s; }
    .btn:hover { background: #c0392b; transform: scale(1.05); }
    .btn-next { background: #2ecc71; margin-top: 10px; }
    .btn-next:hover { background: #27ae60; }
    .modal { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: #2c3e50; padding: 25px; border-radius: 12px; border: 2px solid #f1c40f; width: 90%; max-width: 450px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.8); }
    input[type="text"], select { width: 100%; padding: 10px; margin: 10px 0; border-radius: 5px; border: none; box-sizing: border-box; }
    .hidden { display: none !important; }
    .leaderboard-table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 14px; }
    .leaderboard-table th, .leaderboard-table td { padding: 8px; border-bottom: 1px solid #444; text-align: left; }
    .leaderboard-table th { color: #f1c40f; }
  </style>
  <!-- Three.js CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

  <div id="canvas-container"></div>

  <div class="ui-layer">
    <!-- Top HUD -->
    <div style="display: flex; justify-content: space-between;">
      <div class="hud">
        <div class="hud-title">SMK 17 MUNCAR</div>
        <div class="hud-stats">Player: <span id="disp-name">-</span></div>
      </div>
      <div class="hud" style="text-align: right;">
        <div class="hud-stats">Level: <span id="disp-level" style="color:#2ecc71;">1</span>/10</div>
        <div class="hud-stats">Koin: <span id="disp-coins" style="color:#f1c40f;">0</span> | Skor: <span id="disp-score">0</span></div>
      </div>
    </div>

    <!-- Bottom Controls -->
    <div style="display: flex; justify-content: space-between; align-items: flex-end;">
      <button class="btn interactive btn-next" onclick="openQuizModal()">⏩ Lanjut Ke Level Berikutnya</button>
      <button class="btn interactive" onclick="openLeaderboard()">🏆 Leaderboard</button>
    </div>
  </div>

  <!-- Modal Register -->
  <div id="modal-register" class="modal interactive">
    <h2>Pendaftaran Game</h2>
    <p>Selamat datang di SMK PINTAR 3D Runner!</p>
    <input type="text" id="reg-nama" placeholder="Nama Lengkap Siswa" required>
    <input type="text" id="reg-wa" placeholder="Nomor WhatsApp (+628...)" required>
    <button class="btn btn-next" style="width: 100%;" onclick="startPlay()">Mulai Bermain</button>
  </div>

  <!-- Modal Quiz / Level Finish -->
  <div id="modal-quiz" class="modal interactive hidden">
    <h2 id="quiz-title">Kuis Jurusan</h2>
    <p id="quiz-desc">Penjelasan Jurusan...</p>
    <div id="quiz-options" style="text-align: left; margin: 15px 0;"></div>
    <button class="btn btn-next" style="width: 100%;" onclick="submitAnswer()">Kirim Jawaban & Lanjut</button>
  </div>

  <!-- Modal Leaderboard -->
  <div id="modal-leaderboard" class="modal interactive hidden">
    <h2>Peringkat Top 10</h2>
    <table class="leaderboard-table">
      <thead>
        <tr><th>#</th><th>Nama</th><th>Lvl</th><th>Skor</th></tr>
      </thead>
      <tbody id="leaderboard-body">
        <tr><td colspan="4" style="text-align: center;">Memuat Data...</td></tr>
      </tbody>
    </table>
    <button class="btn" style="margin-top: 15px; width: 100%;" onclick="closeLeaderboard()">Tutup</button>
  </div>

  <script>
    // Data Global Game
    let playerData = { nama: '', whatsapp: '', level: 1, skor: 0, koin: 0 };
    let isPlaying = false;
    let scene, camera, renderer, playerGroup;
    let coins = [], obstacles = [];
    let speed = 0.3;

    // Database Kuis 10 Level Jurusan SMK 17 Muncar
    const quizData = [
      { title: "Level 1: Akuntansi (AKL)", desc: "AKL mempelajari pencatatan keuangan bisnis.", q: "Manakah laporan yang mencatat pendapatan & beban?", opts: ["Laporan Laba Rugi", "Neraca", "Jurnal Umum"], ans: 0 },
      { title: "Level 2: Bisnis Daring (BDP)", desc: "BDP fokus pada Pemasaran Digital & E-Commerce.", q: "Apa kepanjangan dari SEO dalam Digital Marketing?", opts: ["Search Engine Optimization", "Social Engine Option", "Sales Executive Online"], ans: 0 },
      { title: "Level 3: Perhotelan (PH)", desc: "PH mengajarkan pelayanan hospitality profesional.", q: "Departemen yang menangani kebersihan kamar hotel adalah?", opts: ["Housekeeping", "Front Office", "Food & Beverage"], ans: 0 },
      { title: "Level 4: Rekayasa Perangkat Lunak (RPL)", desc: "RPL mempelajari pemrograman web & aplikasi.", q: "Bahasa pemrograman utama untuk struktur halaman web adalah?", opts: ["HTML", "Python", "C++"], ans: 0 },
      { title: "Level 5: Teknik Otomotif (TO)", desc: "TO fokus pada perawatan mesin kendaraan modern.", q: "Komponen yang berfungsi memercikkan bunga api pada mesin bensin?", opts: ["Busi", "Karburator", "Radiator"], ans: 0 },
      { title: "Level 6: Teknik Pengelasan (TP)", desc: "TP mempelajari penyambungan logam standar industri.", q: "Proses las titik dikenal juga dengan istilah?", opts: ["Spot Welding", "Arc Welding", "TIG Welding"], ans: 0 },
      { title: "Level 7: Minat Karir", desc: "Pertanyaan Rencana Kelulusan SMP.", q: "Apa rencana utama Anda setelah lulus SMP?", opts: ["Melanjutkan ke SMK 17 Muncar", "Bekerja", "Belum Tahu"], ans: 0 },
      { title: "Level 8: Pilihan Jurusan", desc: "Konsultasi Jurusan SMK PINTAR.", q: "Jurusan mana di SMK 17 Muncar yang paling Anda minati?", opts: ["RPL / AKL / BDP", "PH / TO / TP", "Masih Bingung"], ans: 0 },
      { title: "Level 9: Jurusan Impian", desc: "Fokus Pengembangan Bakat.", q: "Apakah Anda ingin langsung bekerja setelah lulus SMK?", opts: ["Ya, Langsung Kerja", "Kuliah Dulu", "Wirausaha"], ans: 0 },
      { title: "Level 10: Cita-Cita", desc: "Evaluasi Akhir Game SMK PINTAR.", q: "Apakah Anda bersedia menerima info pendaftaran SMK 17 Muncar?", opts: ["Ya, Sangat Bersedia", "Mungkin Nanti", "Tidak"], ans: 0 }
    ];

    function init3D() {
      const container = document.getElementById('canvas-container');
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x1a1a2e);
      scene.fog = new THREE.Fog(0x1a1a2e, 10, 80);

      camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.set(0, 5, 10);

      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      container.appendChild(renderer.domElement);

      // Pencahayaan
      const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
      scene.add(ambientLight);

      const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
      dirLight.position.set(10, 20, 10);
      scene.add(dirLight);

      // Jalankan Lintasan (Road)
      const roadGeo = new THREE.PlaneGeometry(10, 200);
      const roadMat = new THREE.MeshBasicMaterial({ color: 0x333333 });
      const road = new THREE.Mesh(roadGeo, roadMat);
      road.rotation.x = -Math.PI / 2;
      scene.add(road);

      // MENGBUAT KARAKTER PRINCESS DENGAN MAHKOTA ANGKA 17
      createPrincessCharacter();

      // Spawn Koin dan Rintangan Gedung
      spawnElements();

      // Keyboard Listener
      window.addEventListener('keydown', (e) => {
        if (!isPlaying) return;
        if (e.key === 'ArrowLeft' || e.key === 'a') {
          if (playerGroup.position.x > -3) playerGroup.position.x -= 3;
        } else if (e.key === 'ArrowRight' || e.key === 'd') {
          if (playerGroup.position.x < 3) playerGroup.position.x += 3;
        }
      });

      animate();
    }

    function createPrincessCharacter() {
      playerGroup = new THREE.Group();

      // Gaun / Badan (Kerucut Pink)
      const bodyGeo = new THREE.ConeGeometry(0.8, 2, 16);
      const bodyMat = new THREE.MeshStandardMaterial({ color: 0xff6b81 });
      const body = new THREE.Mesh(bodyGeo, bodyMat);
      body.position.y = 1;
      playerGroup.add(body);

      // Kepala
      const headGeo = new THREE.SphereGeometry(0.4, 16, 16);
      const headMat = new THREE.MeshStandardMaterial({ color: 0xffdbac });
      const head = new THREE.Mesh(headGeo, headMat);
      head.position.y = 2.2;
      playerGroup.add(head);

      // Mahkota Emas
      const crownGeo = new THREE.CylinderGeometry(0.25, 0.2, 0.3, 8);
      const crownMat = new THREE.MeshStandardMaterial({ color: 0xf1c40f, metalness: 0.8 });
      const crown = new THREE.Mesh(crownGeo, crownMat);
      crown.position.y = 2.6;
      playerGroup.add(crown);

      // Canvas Text 17 Pada Mahkota
      const canvas = document.createElement('canvas');
      canvas.width = 64; canvas.height = 64;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#f1c40f'; ctx.fillRect(0,0,64,64);
      ctx.fillStyle = '#e74c3c'; ctx.font = 'Bold 36px Arial';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('17', 32, 32);

      const texture = new THREE.CanvasTexture(canvas);
      const badgeGeo = new THREE.PlaneGeometry(0.3, 0.3);
      const badgeMat = new THREE.MeshBasicMaterial({ map: texture, transparent: true });
      const badge = new THREE.Mesh(badgeGeo, badgeMat);
      badge.position.set(0, 2.65, 0.26);
      playerGroup.add(badge);

      playerGroup.position.set(0, 0, 4);
      scene.add(playerGroup);
    }

    function spawnElements() {
      // Clear Old
      coins.forEach(c => scene.remove(c));
      obstacles.forEach(o => scene.remove(o));
      coins = []; obstacles = [];

      const lanes = [-3, 0, 3];
      for (let i = 0; i < 15; i++) {
        // Spawn Coins
        const coinGeo = new THREE.CylinderGeometry(0.4, 0.4, 0.1, 16);
        const coinMat = new THREE.MeshStandardMaterial({ color: 0xf1c40f });
        const coin = new THREE.Mesh(coinGeo, coinMat);
        coin.rotation.x = Math.PI / 2;
        coin.position.set(lanes[Math.floor(Math.random()*3)], 0.5, -i * 10 - 10);
        scene.add(coin);
        coins.push(coin);

        // Spawn Building Obstacles (Gedung Sekolah)
        if (i % 2 === 0) {
          const obsGeo = new THREE.BoxGeometry(1.5, 3, 1.5);
          const obsMat = new THREE.MeshStandardMaterial({ color: 0x34495e });
          const obs = new THREE.Mesh(obsGeo, obsMat);
          obs.position.set(lanes[Math.floor(Math.random()*3)], 1.5, -i * 10 - 15);
          scene.add(obs);
          obstacles.push(obs);
        }
      }
    }

    function animate() {
      requestAnimationFrame(animate);

      if (isPlaying) {
        // Move Elements Toward Player
        coins.forEach(coin => {
          coin.position.z += speed;
          coin.rotation.z += 0.05;

          // Deteksi Tabrakan Koin
          if (playerGroup.position.distanceTo(coin.position) < 1.2) {
            coin.position.z = 20; // Pindahkan jauh
            playerData.koin += 1;
            playerData.skor += 10;
            updateHUD();
          }
          if (coin.position.z > 10) coin.position.z = -150;
        });

        obstacles.forEach(obs => {
          obs.position.z += speed;
          // Tabrakan Rintangan (Reset posisi sedikit mundur)
          if (playerGroup.position.distanceTo(obs.position) < 1.3) {
            playerGroup.position.x = 0;
            obs.position.z = 20;
          }
          if (obs.position.z > 10) obs.position.z = -150;
        });
      }

      renderer.render(scene, camera);
    }

    function updateHUD() {
      document.getElementById('disp-name').innerText = playerData.nama;
      document.getElementById('disp-level').innerText = playerData.level;
      document.getElementById('disp-coins').innerText = playerData.koin;
      document.getElementById('disp-score').innerText = playerData.skor;
    }

    function startPlay() {
      const nama = document.getElementById('reg-nama').value;
      const wa = document.getElementById('reg-wa').value;
      if (!nama || !wa) return alert("Harap isi Nama dan Nomor WhatsApp!");

      playerData.nama = nama;
      playerData.whatsapp = wa;
      document.getElementById('modal-register').classList.add('hidden');
      updateHUD();
      isPlaying = true;
    }

    // Buka Modal Kuis (Bisa Dipanggil Kapan Saja)
    function openQuizModal() {
      isPlaying = false;
      const qIndex = (playerData.level - 1) % quizData.length;
      const currentQuiz = quizData[qIndex];

      document.getElementById('quiz-title').innerText = currentQuiz.title;
      document.getElementById('quiz-desc').innerText = currentQuiz.desc + "\n\nPertanyaan: " + currentQuiz.q;
      
      const optContainer = document.getElementById('quiz-options');
      optContainer.innerHTML = '';
      currentQuiz.opts.forEach((opt, idx) => {
        optContainer.innerHTML += `
          <label style="display:block; margin: 8px 0; cursor:pointer;">
            <input type="radio" name="quiz_opt" value="${idx}" ${idx===0?'checked':''}> ${opt}
          </label>`;
      });

      document.getElementById('modal-quiz').classList.remove('hidden');
    }

    // Kirim Jawaban ke Backend Vercel -> Google Sheets
    async function submitAnswer() {
      const selected = document.querySelector('input[name="quiz_opt"]:checked');
      const ansVal = selected ? selected.value : "0";
      
      playerData.skor += 50; // Bonus skor jawab kuis

      // Post Data Ke Vercel Backend
      try {
        await fetch('/api/leaderboard', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            nama: playerData.nama,
            whatsapp: playerData.whatsapp,
            level: playerData.level,
            jawaban: "Opsi " + (parseInt(ansVal)+1),
            skor: playerData.skor
          })
        });
      } catch (e) {
        console.log("Gagal posting skor:", e);
      }

      // Naikkan Level
      if (playerData.level < 10) {
        playerData.level += 1;
      }
      
      document.getElementById('modal-quiz').classList.add('hidden');
      updateHUD();
      spawnElements();
      isPlaying = true;
    }

    // Ambil Data Leaderboard
    async function openLeaderboard() {
      isPlaying = false;
      document.getElementById('modal-leaderboard').classList.remove('hidden');
      const tbody = document.getElementById('leaderboard-body');
      tbody.innerHTML = '<tr><td colspan="4" style="text-align: center;">Memuat Data...</td></tr>';

      try {
        const res = await fetch('/api/leaderboard');
        const data = await res.json();
        
        tbody.innerHTML = '';
        if (data && data.length > 0) {
          data.forEach((row, i) => {
            tbody.innerHTML += `
              <tr>
                <td>${i+1}</td>
                <td>${row.nama}</td>
                <td>${row.level}</td>
                <td>${row.skor}</td>
              </tr>`;
          });
        } else {
          tbody.innerHTML = '<tr><td colspan="4" style="text-align: center;">Belum Ada Data Skor</td></tr>';
        }
      } catch (e) {
        tbody.innerHTML = '<tr><td colspan="4" style="text-align: center; color:#e74c3c;">Gagal Memuat Leaderboard</td></tr>';
      }
    }

    function closeLeaderboard() {
      document.getElementById('modal-leaderboard').classList.add('hidden');
      if (playerData.nama) isPlaying = true;
    }

    window.onload = init3D;
  </script>
</body>
</html>
