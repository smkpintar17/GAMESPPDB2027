<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SMK PINTAR 3D Runner - SMK 17 Muncar</title>
  <style>
    * { touch-action: manipulation; box-sizing: border-box; }
    body { margin: 0; overflow: hidden; font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background: #4a90e2; color: #fff; user-select: none; }
    #canvas-container { width: 100vw; height: 100vh; display: block; }
    
    .ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; padding: 12px; }
    .interactive { pointer-events: auto; }
    
    .hud { background: rgba(255, 255, 255, 0.85); color: #2c3e50; padding: 8px 15px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.15); border: 2px solid #3498db; }
    .hud-title { font-weight: 800; font-size: 16px; color: #2980b9; }
    .hud-stats { font-size: 14px; margin-top: 2px; font-weight: 600; }
    
    .btn { background: #e74c3c; color: white; border: none; padding: 12px 18px; font-weight: bold; font-size: 14px; border-radius: 25px; cursor: pointer; transition: 0.2s; box-shadow: 0 4px 10px rgba(0,0,0,0.2); }
    .btn:active { transform: scale(0.95); }
    .btn-next { background: #2ecc71; }
    .btn-next:hover { background: #27ae60; }
    
    /* Virtual Mobile Touch Controls */
    .touch-controls { display: flex; justify-content: space-between; width: 100%; padding: 0 10px 10px 10px; }
    .touch-btn { width: 65px; height: 65px; background: rgba(255, 255, 255, 0.4); border: 2px solid #fff; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 28px; color: #fff; text-shadow: 0 2px 4px rgba(0,0,0,0.3); backdrop-filter: blur(4px); }
    .touch-btn:active { background: rgba(255, 255, 255, 0.7); color: #2c3e50; }

    .modal { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: #ffffff; color: #2c3e50; padding: 20px; border-radius: 20px; border: 4px solid #f1c40f; width: 90%; max-width: 400px; text-align: center; box-shadow: 0 15px 35px rgba(0,0,0,0.3); }
    input[type="text"] { width: 100%; padding: 12px; margin: 8px 0; border-radius: 10px; border: 2px solid #bdc3c7; box-sizing: border-box; font-size: 14px; outline: none; }
    input[type="text"]:focus { border-color: #3498db; }
    
    .hidden { display: none !important; }
    .leaderboard-table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 13px; }
    .leaderboard-table th, .leaderboard-table td { padding: 8px; border-bottom: 1px solid #ecf0f1; text-align: left; }
    .leaderboard-table th { color: #e67e22; }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

  <div id="canvas-container"></div>

  <div class="ui-layer">
    <!-- Top HUD -->
    <div style="display: flex; justify-content: space-between; gap: 8px;">
      <div class="hud">
        <div class="hud-title">SMK 17 MUNCAR</div>
        <div class="hud-stats">Player: <span id="disp-name">-</span></div>
      </div>
      <div class="hud" style="text-align: right;">
        <div class="hud-stats">Lvl: <span id="disp-level" style="color:#2ecc71;">1</span>/10</div>
        <div class="hud-stats">🪙 <span id="disp-coins" style="color:#f39c12;">0</span> | ⭐ <span id="disp-score">0</span></div>
      </div>
    </div>

    <!-- Bottom Action Buttons & Touch Controls -->
    <div>
      <div style="display: flex; justify-content: space-between; margin-bottom: 10px;">
        <button class="btn interactive btn-next" onclick="openQuizModal()">⏩ Lanjut Level</button>
        <button class="btn interactive" style="background: #9b59b6;" onclick="openLeaderboard()">🏆 Peringkat</button>
      </div>
      
      <!-- Mobile D-Pad Touch Controls -->
      <div class="touch-controls interactive">
        <div class="touch-btn" onclick="movePlayer(-1)">◀</div>
        <div class="touch-btn" onclick="movePlayer(1)">▶</div>
      </div>
    </div>
  </div>

  <!-- Modal Register -->
  <div id="modal-register" class="modal interactive">
    <h2 style="color:#2980b9; margin-top:0;">Pendaftaran Game</h2>
    <p>Selamat datang di SMK PINTAR 3D Runner!</p>
    <input type="text" id="reg-nama" placeholder="Nama Lengkap Siswa" required>
    <input type="text" id="reg-wa" placeholder="Nomor WhatsApp (+628...)" required>
    <button class="btn btn-next" style="width: 100%; margin-top: 10px;" onclick="startPlay()">Mulai Bermain</button>
  </div>

  <!-- Modal Quiz -->
  <div id="modal-quiz" class="modal interactive hidden">
    <h2 id="quiz-title" style="color:#e67e22; margin-top:0;">Kuis Jurusan</h2>
    <p id="quiz-desc">Penjelasan Jurusan...</p>
    <div id="quiz-options" style="text-align: left; margin: 15px 0;"></div>
    <button class="btn btn-next" style="width: 100%;" onclick="submitAnswer()">Kirim Jawaban & Lanjut</button>
  </div>

  <!-- Modal Leaderboard -->
  <div id="modal-leaderboard" class="modal interactive hidden">
    <h2 style="color:#8e44ad; margin-top:0;">Peringkat Top 10</h2>
    <table class="leaderboard-table">
      <thead>
        <tr><th>#</th><th>Nama</th><th>Lvl</th><th>Skor</th></tr>
      </thead>
      <tbody id="leaderboard-body">
        <tr><td colspan="4" style="text-align: center;">Memuat Data...</td></tr>
      </tbody>
    </table>
    <button class="btn" style="margin-top: 15px; width: 100%; background: #7f8c8d;" onclick="closeLeaderboard()">Tutup</button>
  </div>

  <script>
    let playerData = { nama: '', whatsapp: '', level: 1, skor: 0, koin: 0 };
    let isPlaying = false;
    let scene, camera, renderer, playerGroup;
    let coins = [], obstacles = [];
    let speed = 0.35;
    let touchStartX = 0;

    const quizData = [
      { title: "Level 1: Akuntansi (AKL)", desc: "AKL mempelajari pencatatan keuangan bisnis.", q: "Manakah laporan yang mencatat pendapatan & beban?", opts: ["Laporan Laba Rugi", "Neraca", "Jurnal Umum"], ans: 0 },
      { title: "Level 2: Bisnis Daring (BDP)", desc: "BDP fokus pada Pemasaran Digital & E-Commerce.", q: "Apa kepanjangan dari SEO dalam Digital Marketing?", opts: ["Search Engine Optimization", "Social Engine Option", "Sales Executive Online"], ans: 0 },
      { title: "Level 3: Perhotelan (PH)", desc: "PH mengajarkan pelayanan hospitality profesional.", q: "Departemen yang menangani kebersihan kamar hotel adalah?", opts: ["Housekeeping", "Front Office", "Food & Beverage"], ans: 0 },
      { title: "Level 4: Rekayasa Perangkat Lunak (RPL)", desc: "RPL mempelajari pemrograman web & aplikasi.", q: "Bahasa pemrograman utama untuk struktur halaman web adalah?", opts: ["HTML", "Python", "C++"], ans: 0 },
      { title: "Level 5: Teknik Otomotif (TO)", desc: "TO fokus pada perawatan mesin kendaraan modern.", q: "Komponen yang berfungsi memercikkan bunga api pada mesin bensin?", opts: ["Busi", "Karburator", "Radiator"], ans: 0 },
      { title: "Level 6: Teknik Pengelasan (TP)", desc: "TP mempelajari penyambungan logam standar industri.", q: "Proses las titik dikenal juga dengan istilah?", opts: ["Spot Welding", "Arc Welding", "TIG Welding"], ans: 0 },
      { title: "Level 7: Minat Karir", desc: "Pertanyaan Rencana Kelulusan SMP.", q: "Apa rencana utama Anda setelah lulus SMP?", opts: ["Melanjutkan ke SMK 17 Muncar", "Bekerja", "Belum Tahu"], ans: 0 },
      { title: "Level 8: Pilihan Jurusan", desc: "Konsultasi Jurusan SMK PINTAR.", q: "Jurusan mana di SMK 17 Muncar yang paling Anda minati?", opts: ["RPL / AKL / BDP", "PH / TO / TP", "Masih Bingung"], ans: 0 },
      { title: "Level 9: Jurusan Impian", desc: "Fokus Pengembangan Bakat.", q: "Apakah Anda ingin langsung bekerja setelah lulus SMK?", opts: ["Ya, Langsung Kerja", "Kuliah Dulu", "Wirausaha"], ans: 0 },
      { title: "Level 10: Cita-Cita", desc: "Evaluasi Akhir Game SMK PINTAR.", q: "Apakah Anda bersedia menerima info pendaftaran SMK 17 Muncar?", opts: ["Ya, Sangat Bersedia", "Mungkin Nanti", "Tidak"], ans: 0 }
    ];

    function init3D() {
      const container = document.getElementById('canvas-container');
      scene = new THREE.Scene();
      
      // Tema Ceria: Langit Cerah & Fog Lembut
      scene.background = new THREE.Color(0x74b9ff);
      scene.fog = new THREE.Fog(0x74b9ff, 15, 70);

      camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.set(0, 4.5, 9);

      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      container.appendChild(renderer.domElement);

      // Pencahayaan Cerah
      const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
      scene.add(ambientLight);

      const dirLight = new THREE.DirectionalLight(0xffffff, 0.7);
      dirLight.position.set(10, 20, 10);
      scene.add(dirLight);

      // Lintasan Jalan
      const roadGeo = new THREE.PlaneGeometry(10, 200);
      const roadMat = new THREE.MeshStandardMaterial({ color: 0xdfe6e9 });
      const road = new THREE.Mesh(roadGeo, roadMat);
      road.rotation.x = -Math.PI / 2;
      scene.add(road);

      // Karakter Siswa SMA/SMK 3D
      createStudentCharacter();

      // Spawn Koin & Gedung Merah
      spawnElements();

      // Keyboard Controls
      window.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowLeft' || e.key === 'a') movePlayer(-1);
        if (e.key === 'ArrowRight' || e.key === 'd') movePlayer(1);
      });

      // Swipe Touch Controls untuk HP
      window.addEventListener('touchstart', (e) => {
        touchStartX = e.touches[0].clientX;
      }, { passive: true });

      window.addEventListener('touchend', (e) => {
        if (!isPlaying) return;
        let touchEndX = e.changedTouches[0].clientX;
        let diffX = touchEndX - touchStartX;
        if (Math.abs(diffX) > 30) {
          if (diffX < 0) movePlayer(-1);
          else movePlayer(1);
        }
      }, { passive: true });

      window.addEventListener('resize', onWindowResize);
      animate();
    }

    function movePlayer(dir) {
      if (!isPlaying || !playerGroup) return;
      if (dir === -1 && playerGroup.position.x > -3) playerGroup.position.x -= 3;
      if (dir === 1 && playerGroup.position.x < 3) playerGroup.position.x += 3;
    }

    function createStudentCharacter() {
      playerGroup = new THREE.Group();

      // Material
      const skinMat = new THREE.MeshStandardMaterial({ color: 0xffdbac });
      const hairMat = new THREE.MeshStandardMaterial({ color: 0x2c3e50 });
      const shirtMat = new THREE.MeshStandardMaterial({ color: 0xffffff }); // Baju Putih
      const pantsMat = new THREE.MeshStandardMaterial({ color: 0x74b9ff }); // Celana Abu-abu/Biru Muda
      const tieMat = new THREE.MeshStandardMaterial({ color: 0x0984e3 });  // Dasi Biru
      const badgeMat = new THREE.MeshStandardMaterial({ color: 0xd63031 }); // Red Badge

      // Kaki & Celana
      const legGeo = new THREE.CylinderGeometry(0.18, 0.16, 1.2, 12);
      const legL = new THREE.Mesh(legGeo, pantsMat);
      legL.position.set(-0.25, 0.6, 0);
      const legR = legL.clone();
      legR.position.x = 0.25;
      playerGroup.add(legL, legR);

      // Badan / Kemeja Putih
      const bodyGeo = new THREE.BoxGeometry(0.8, 1.1, 0.45);
      const body = new THREE.Mesh(bodyGeo, shirtMat);
      body.position.y = 1.65;
      playerGroup.add(body);

      // Dasi Biru
      const tieGeo = new THREE.BoxGeometry(0.12, 0.6, 0.05);
      const tie = new THREE.Mesh(tieGeo, tieMat);
      tie.position.set(0, 1.7, 0.24);
      playerGroup.add(tie);

      // Badge Merah Putih di Dada
      const badgeGeo = new THREE.BoxGeometry(0.15, 0.1, 0.02);
      const badge = new THREE.Mesh(badgeGeo, badgeMat);
      badge.position.set(-0.22, 1.9, 0.24);
      playerGroup.add(badge);

      // Kepala
      const headGeo = new THREE.SphereGeometry(0.35, 16, 16);
      const head = new THREE.Mesh(headGeo, skinMat);
      head.position.y = 2.45;
      playerGroup.add(head);

      // Rambut
      const hairGeo = new THREE.SphereGeometry(0.37, 16, 16, 0, Math.PI * 2, 0, Math.PI / 2);
      const hair = new THREE.Mesh(hairGeo, hairMat);
      hair.position.y = 2.5;
      playerGroup.add(hair);

      // Lengan Kiri & Kanan (Posisi Melipat Sesuai Gambar)
      const armGeo = new THREE.CylinderGeometry(0.1, 0.1, 0.7, 12);
      const armL = new THREE.Mesh(armGeo, shirtMat);
      armL.rotation.z = Math.PI / 3;
      armL.position.set(-0.35, 1.6, 0.1);
      
      const armR = new THREE.Mesh(armGeo, shirtMat);
      armR.rotation.z = -Math.PI / 3;
      armR.position.set(0.35, 1.6, 0.1);
      playerGroup.add(armL, armR);

      playerGroup.position.set(0, 0, 4);
      scene.add(playerGroup);
    }

    function spawnElements() {
      coins.forEach(c => scene.remove(c));
      obstacles.forEach(o => scene.remove(o));
      coins = []; obstacles = [];

      const lanes = [-3, 0, 3];
      for (let i = 0; i < 15; i++) {
        // Koin Emas
        const coinGeo = new THREE.CylinderGeometry(0.35, 0.35, 0.08, 16);
        const coinMat = new THREE.MeshStandardMaterial({ color: 0xf1c40f, metalness: 0.5 });
        const coin = new THREE.Mesh(coinGeo, coinMat);
        coin.rotation.x = Math.PI / 2;
        coin.position.set(lanes[Math.floor(Math.random()*3)], 0.8, -i * 10 - 10);
        scene.add(coin);
        coins.push(coin);

        // Obstacle Gedung Warna Merah
        if (i % 2 === 0) {
          const obsGeo = new THREE.BoxGeometry(1.8, 3.5, 1.8);
          const obsMat = new THREE.MeshStandardMaterial({ color: 0xff4757 }); // Merah Ceria
          const obs = new THREE.Mesh(obsGeo, obsMat);
          obs.position.set(lanes[Math.floor(Math.random()*3)], 1.75, -i * 10 - 15);
          
          // Jendela Gedung
          const winGeo = new THREE.PlaneGeometry(1.2, 2.5);
          const winMat = new THREE.MeshBasicMaterial({ color: 0xffffffff });
          const windowMesh = new THREE.Mesh(winGeo, winMat);
          windowMesh.position.set(0, 0, 0.91);
          obs.add(windowMesh);

          scene.add(obs);
          obstacles.push(obs);
        }
      }
    }

    function animate() {
      requestAnimationFrame(animate);

      if (isPlaying) {
        coins.forEach(coin => {
          coin.position.z += speed;
          coin.rotation.z += 0.05;

          if (playerGroup.position.distanceTo(coin.position) < 1.2) {
            coin.position.z = 20;
            playerData.koin += 1;
            playerData.skor += 10;
            updateHUD();
          }
          if (coin.position.z > 10) coin.position.z = -150;
        });

        obstacles.forEach(obs => {
          obs.position.z += speed;
          if (playerGroup.position.distanceTo(obs.position) < 1.3) {
            playerGroup.position.x = 0;
            obs.position.z = 20;
          }
          if (obs.position.z > 10) obs.position.z = -150;
        });
      }

      renderer.render(scene, camera);
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    function updateHUD() {
      document.getElementById('disp-name').innerText = playerData.nama;
      document.getElementById('disp-level').innerText = playerData.level;
      document.getElementById('disp-coins').innerText = playerData.koin;
      document.getElementById('disp-score').innerText = playerData.skor;
    }

    function startPlay() {
      const nama = document.getElementById('reg-nama').value;
      const wa = document.getElementById('reg-wa').value;
      if (!nama || !wa) return alert("Harap isi Nama dan Nomor WhatsApp!");

      playerData.nama = nama;
      playerData.whatsapp = wa;
      document.getElementById('modal-register').classList.add('hidden');
      updateHUD();
      isPlaying = true;
    }

    function openQuizModal() {
      isPlaying = false;
      const qIndex = (playerData.level - 1) % quizData.length;
      const currentQuiz = quizData[qIndex];

      document.getElementById('quiz-title').innerText = currentQuiz.title;
      document.getElementById('quiz-desc').innerText = currentQuiz.desc + "\n\nPertanyaan: " + currentQuiz.q;
      
      const optContainer = document.getElementById('quiz-options');
      optContainer.innerHTML = '';
      currentQuiz.opts.forEach((opt, idx) => {
        optContainer.innerHTML += `
          <label style="display:block; margin: 10px 0; cursor:pointer; font-weight: 500;">
            <input type="radio" name="quiz_opt" value="${idx}" ${idx===0?'checked':''}> ${opt}
          </label>`;
      });

      document.getElementById('modal-quiz').classList.remove('hidden');
    }

    async function submitAnswer() {
      const selected = document.querySelector('input[name="quiz_opt"]:checked');
      const ansVal = selected ? selected.value : "0";
      
      playerData.skor += 50;

      try {
        await fetch('/api/leaderboard', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            nama: playerData.nama,
            whatsapp: playerData.whatsapp,
            level: playerData.level,
            jawaban: "Opsi " + (parseInt(ansVal)+1),
            skor: playerData.skor
          })
        });
      } catch (e) {
        console.log("Gagal posting skor:", e);
      }

      if (playerData.level < 10) playerData.level += 1;
      
      document.getElementById('modal-quiz').classList.add('hidden');
      updateHUD();
      spawnElements();
      isPlaying = true;
    }

    async function openLeaderboard() {
      isPlaying = false;
      document.getElementById('modal-leaderboard').classList.remove('hidden');
      const tbody = document.getElementById('leaderboard-body');
      tbody.innerHTML = '<tr><td colspan="4" style="text-align: center;">Memuat Data...</td></tr>';

      try {
        const res = await fetch('/api/leaderboard');
        const data = await res.json();
        
        tbody.innerHTML = '';
        if (data && data.length > 0) {
          data.forEach((row, i) => {
            tbody.innerHTML += `
              <tr>
                <td>${i+1}</td>
                <td>${row.nama}</td>
                <td>${row.level}</td>
                <td>${row.skor}</td>
              </tr>`;
          });
        } else {
          tbody.innerHTML = '<tr><td colspan="4" style="text-align: center;">Belum Ada Data Skor</td></tr>';
        }
      } catch (e) {
        tbody.innerHTML = '<tr><td colspan="4" style="text-align: center; color:#e74c3c;">Gagal Memuat Leaderboard</td></tr>';
      }
    }

    function closeLeaderboard() {
      document.getElementById('modal-leaderboard').classList.add('hidden');
      if (playerData.nama) isPlaying = true;
    }

    window.onload = init3D;
  </script>
</body>
</html>
